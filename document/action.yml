name: 'Document MoonBit'
description: >
  Build your README.md into a single inlined HTML page using Vite + Shadcn UI
  and deploy it to GitHub Pages.

inputs:
  readme-path:
    description: 'Path to the README.md file, relative to the repository root.'
    required: false
    default: 'README.md'
  title:
    description: 'Page title shown in the browser tab. Defaults to the repo name.'
    required: false
    default: ''

outputs:
  page-url:
    description: 'URL of the deployed GitHub Pages site.'
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Build documentation site
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        README_PATH: ${{ github.workspace }}/${{ inputs.readme-path }}
        VITE_PAGE_TITLE: ${{ inputs.title || github.event.repository.name }}
      run: npm run build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ github.action_path }}/dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
