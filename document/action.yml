name: 'Document MoonBit'
description: >
  Scan all README.md files in the repository and build them into a single
  self-contained HTML documentation site using Vite + React.
  Optionally deploy to GitHub Pages when deploy is set to 'true'.

inputs:
  repo-root:
    description: >
      Root directory to scan for README.md files, relative to the repository
      root. All README.md files found under this directory are included and
      their folder hierarchy is preserved. Defaults to the repository root.
    required: false
    default: '.'
  readme-path:
    description: >
      Deprecated — use repo-root instead.
      Path to a single README.md file, relative to the repository root.
      When set, only that one file is rendered (single-page mode).
    required: false
    default: ''
  title:
    description: 'Page title shown in the browser tab. Defaults to the repo name.'
    required: false
    default: ''
  deploy:
    description: >
      Set to 'true' to upload the built site as a GitHub Pages artifact and
      deploy it. The calling workflow must have `pages: write` and
      `id-token: write` permissions.
    required: false
    default: 'false'

outputs:
  dist-path:
    description: 'Absolute path to the built documentation directory (contains index.html).'
    value: ${{ github.action_path }}/dist
  page-url:
    description: 'URL of the deployed GitHub Pages site (only set when deploy is true).'
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Build documentation site
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        # Multi-README mode: scan everything under repo-root (default).
        REPO_ROOT: ${{ github.workspace }}/${{ inputs.repo-root }}
        # Legacy single-file mode: set README_PATH when readme-path is given.
        README_PATH: ${{ inputs.readme-path != '' && format('{0}/{1}', github.workspace, inputs.readme-path) || '' }}
        VITE_PAGE_TITLE: ${{ inputs.title || github.event.repository.name }}
        VITE_REPO_FULL_NAME: ${{ github.repository }}
      run: npm run build

    - name: Upload Pages artifact
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ github.action_path }}/dist

    - name: Deploy to GitHub Pages
      if: inputs.deploy == 'true'
      id: deployment
      uses: actions/deploy-pages@v4
