name: 'Document MoonBit'
description: >
  Build your README.md into a single inlined HTML page using Vite + Shadcn UI.
  Optionally deploy to GitHub Pages when deploy is set to 'true'.

inputs:
  readme-path:
    description: 'Path to the README.md file, relative to the repository root.'
    required: false
    default: 'README.md'
  title:
    description: 'Page title shown in the browser tab. Defaults to the repo name.'
    required: false
    default: ''
  deploy:
    description: >
      Set to 'true' to upload the built site as a GitHub Pages artifact and
      deploy it. The calling workflow must have `pages: write` and
      `id-token: write` permissions.
    required: false
    default: 'false'

outputs:
  dist-path:
    description: 'Absolute path to the built documentation directory (contains index.html).'
    value: ${{ github.action_path }}/dist
  page-url:
    description: 'URL of the deployed GitHub Pages site (only set when deploy is true).'
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Build documentation site
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        README_PATH: ${{ github.workspace }}/${{ inputs.readme-path }}
        VITE_PAGE_TITLE: ${{ inputs.title || github.event.repository.name }}
        VITE_REPO_FULL_NAME: ${{ github.repository }}
      run: npm run build

    - name: Upload Pages artifact
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ github.action_path }}/dist

    - name: Deploy to GitHub Pages
      if: inputs.deploy == 'true'
      id: deployment
      uses: actions/deploy-pages@v4
